  <style>
    :root {
      --bg: #090403;
      --card: #180b07;
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --crimson: #991b1b;
      --border: #572005;
      --text: #fef3c7;
      --muted: #a8a29e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #120603 !important;
      color: #fef3c7 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand { font-size: 1.15rem; font-weight: bold; color: var(--gold-bright); }
    .status-badge { font-size: 0.75rem; background: #eab308; padding: 3px 10px; border-radius: 12px; font-weight: bold; color: #fff; transition: background 0.3s; }
    
    .app-container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 20px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      text-align: center;
      display: block !important;
      visibility: visible !important;
    }
    h2 { font-size: 1.35rem; color: var(--gold-bright); margin-bottom: 8px; }
    p { font-size: 0.9rem; color: var(--muted); line-height: 1.4; margin-bottom: 15px; }

    input {
      width: 100%;
      background: #0d0503;
      border: 1.5px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: var(--gold); }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-gold { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
    .btn-crimson { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }
    .btn-secondary { background: #2b1107; border: 1px solid var(--border); color: var(--text); }

    .code-pill {
      display: inline-block;
      background: #0d0503;
      border: 2px dashed var(--gold);
      color: var(--gold-bright);
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 4px;
      padding: 6px 18px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .roster { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .parchi-card {
      width: 220px;
      height: 140px;
      margin: 15px auto;
      background: #250d05;
      border: 2px solid var(--gold);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
